<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A4B76">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TimeCool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: phone-first single column (max 720px); a time-card "ตอกบัตร" stamp motif carries the employee view, the manager view is a tabbed console. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#13202F; --muted:#586577; --line:#D2DAE4;
  --accent:#1A4B76; --accent-ink:#FFFFFF; --stamp:#B8410E; --brand2:#F7BC12; --brand2-ink:#1A2433; --logo-l:block; --logo-d:none;
  --ok:#1D7445; --ok-bg:#E2F2E8; --warn:#9A5B00; --warn-bg:#FBEFD9; --bad:#B42318; --bad-bg:#FBE4E1;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121A; --surface:#141C27; --sunk:#101720; --ink:#E3E9F1; --muted:#93A1B4; --line:#263243;
  --accent:#7FB1E3; --accent-ink:#0A1928; --stamp:#F0875A; --brand2:#F6C33A; --brand2-ink:#1A1405; --logo-l:none; --logo-d:block;
  --ok:#5FD08F; --ok-bg:#163223; --warn:#F2B455; --warn-bg:#36290F; --bad:#FF8A7E; --bad-bg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121A; --surface:#141C27; --sunk:#101720; --ink:#E3E9F1; --muted:#93A1B4; --line:#263243;
  --accent:#7FB1E3; --accent-ink:#0A1928; --stamp:#F0875A; --brand2:#F6C33A; --brand2-ink:#1A1405; --logo-l:none; --logo-d:block;
  --ok:#5FD08F; --ok-bg:#163223; --warn:#F2B455; --warn-bg:#36290F; --bad:#FF8A7E; --bad-bg:#3A1A17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:1.15rem;font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-t{display:flex;flex-direction:column;line-height:1.15}
.logo{height:40px;width:auto;flex:none}
.logo-l{display:var(--logo-l)}.logo-d{display:var(--logo-d)}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.brand .co{color:var(--muted);font-size:.82rem}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* clock hero */
.clock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.clock::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:1.5px dashed var(--line)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.who b{font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.big{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(2.8rem,13vw,4.2rem);font-weight:600;letter-spacing:-.02em;line-height:1}
.big .sec{font-size:.45em;color:var(--muted);margin-left:4px}
.date{color:var(--muted)}
.punch{appearance:none;border:0;border-radius:14px;padding:16px 18px;font-family:var(--f-display);font-size:1.2rem;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.punch:active{transform:scale(.98)}
.punch.out{background:var(--brand2);color:var(--brand2-ink)}
.punch[disabled]{opacity:.55;cursor:progress}
.hint{font-size:.85rem;color:var(--muted)}

/* time card */
.card{border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sunk)}
.card-row{display:grid;grid-template-columns:1.5fr 1fr 1fr .8fr;border-top:1px solid var(--line)}
.card-row:first-child{border-top:0;background:var(--surface);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card-row > div{padding:9px 10px;border-left:1px dashed var(--line);min-width:0}
.card-row > div:first-child{border-left:0}
.stamp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--stamp);font-weight:600;display:inline-block;transform:rotate(-1.5deg)}
.card-row.hol{background:var(--warn-bg)}
.holname{font-size:.72rem;color:var(--warn);line-height:1.3}
.hdate{flex:none;width:46px;text-align:center;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;line-height:1.1}
.hdate .d{display:block;font-family:var(--f-mono);font-weight:600;font-size:1.1rem;padding:4px 0 2px}
.hdate .m{display:block;font-size:.68rem;background:var(--ink);color:var(--surface);padding:2px 0}
.card-row.off{color:var(--muted);background:var(--bg)}
.offname{font-size:.72rem;color:var(--muted);line-height:1.3}
.dchip{flex-direction:row;align-items:center;gap:0;cursor:pointer}
.dchip input{position:absolute;opacity:0;width:1px;height:1px}
.dchip span{display:inline-block;min-width:42px;text-align:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;color:var(--muted);background:var(--sunk)}
.dchip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.bals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.bal{display:flex;flex-direction:column;gap:5px;min-width:0}
.bal-h{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.bar{height:6px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.welfare summary{cursor:pointer;font-weight:600;font-family:var(--f-display)}
.welfare dl{margin:10px 0 0;display:grid;gap:8px}
.welfare dt{font-weight:600;font-size:.9rem}.welfare dd{margin:0;color:var(--muted);font-size:.88rem}
.warns{margin:6px 0 0;padding-left:18px;color:var(--warn)}.warns li{margin:2px 0}
.note .warns{color:inherit}
.danger{color:var(--bad)!important;font-weight:600}
.auth{max-width:520px;width:100%;align-self:center}
#acctBar{gap:6px}
.stamp.blank{color:var(--line);transform:none}

/* chips */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-n{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.sample{font-size:.7rem;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:0 5px;margin-left:6px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk);border:1px solid var(--line);flex:none;cursor:zoom-in}
.thumb.none{display:grid;place-items:center;color:var(--muted);font-size:.7rem;cursor:default}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:.92rem}

/* forms */
form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.no{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--stamp);color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px;margin-left:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:600;line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;background:var(--sunk);font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:40;padding:24px;cursor:zoom-out}
.zoom img{max-height:80vh;border-radius:12px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem}
@media (max-width:440px){.stats .stat .v{font-size:1.35rem}.card-row{grid-template-columns:1.3fr 1fr 1fr .8fr}.card-row>div{padding:8px 7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function minsOf(t){const [h,m]=String(t||"0:0").split(":").map(Number);return h*60+m}
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ---------- derived ---------- */
function dayMap(){ // empId|date -> {in,out,recs}
  const m={};
  for(const r of S.recs){const k=r.empId+"|"+r.date;(m[k]??={ins:[],outs:[],recs:[]});m[k].recs.push(r);(r.type==="in"?m[k].ins:m[k].outs).push(r.ts)}
  for(const k in m){const v=m[k];v.in=v.ins.length?Math.min(...v.ins):null;v.out=v.outs.length?Math.max(...v.outs):null}
  return m;
}
function holOf(k){return S.hols.find(h=>h.date===k)}
const DOW=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
function isWorkDay(k){const wd=S.cfg.workDays||[1,2,3,4,5];return wd.includes(new Date(k+"T12:00:00").getDay())&&!holOf(k)}
function monthWorkDays(month){const [y,m]=month.split("-").map(Number);const n=new Date(y,m,0).getDate();const out=[];for(let d=1;d<=n;d++){const k=`${month}-${pad(d)}`;if(isWorkDay(k))out.push(k)}return out}
function inStatus(ts){if(!ts)return null;const d=new Date(ts);if(!isWorkDay(dkey(d)))return"ok";const m=d.getHours()*60+d.getMinutes();
  if(m<=minsOf(S.cfg.start)+Number(S.cfg.grace||0))return"ok";if(m<=minsOf(S.cfg.halfAfter||"09:00"))return"late";if(m<=minsOf(S.cfg.fullAfter||"13:00"))return"half";return"full"}
function isLate(ts){return inStatus(ts)==="late"}
const IN_PILL={late:'<span class="pill p-warn">สาย</span>',half:'<span class="pill p-bad">ขาดครึ่งวันเช้า</span>',full:'<span class="pill p-bad">ขาดงาน</span>'};
function inPill(ts){return IN_PILL[inStatus(ts)]||""}
function workHours(v){if(!v||!v.in||!v.out||v.out<=v.in)return 0;let m=(v.out-v.in)/60000;if(m>360)m-=Number(S.cfg.breakMin||0);return Math.max(0,m/60)}
function gpsPill(r){
  if(!r)return"";
  if(r.gps==="ok")return`<span class="pill p-ok">ในพื้นที่ ${r.dist!=null?Math.round(r.dist)+" ม.":""}</span>`;
  if(r.gps==="far")return`<span class="pill p-bad">นอกพื้นที่ ${r.dist!=null?(r.dist>=1000?(r.dist/1000).toFixed(1)+" กม.":Math.round(r.dist)+" ม."):""}</span>`;
  if(r.gps==="pos")return`<span class="pill p-n">มีพิกัด</span>`;
  return`<span class="pill p-warn">ไม่มี GPS</span>`;
}
const LEAVE={
  vacation:{n:"ลาพักร้อน",ref:"ข้อ 17",notice:3,maxRun:3},
  personal:{n:"ลากิจ",ref:"ข้อ 19",cap:5,paid:3,notice:3},
  sick:{n:"ลาป่วย",ref:"ข้อ 20",cap:30,cert:3},
  funeral:{n:"ลาฌาปนกิจ",ref:"ข้อ 27",cap:5},
  marriage:{n:"ลาสมรส",ref:"ข้อ 25",cap:5,notice:15,once:true},
  ordain:{n:"ลาอุปสมบท",ref:"ข้อ 26",cap:15,notice:15,once:true,afterProb:true},
  maternity:{n:"ลาคลอด",ref:"ข้อ 21",cap:98,cal:true},
  steril:{n:"ลาทำหมัน",ref:"ข้อ 22",notice:3},
  military:{n:"ลารับราชการทหาร",ref:"ข้อ 23",cap:60},
  training:{n:"ลาฝึกอบรม (ไม่รับค่าจ้าง)",ref:"ข้อ 24",cap:30,times:3,notice:7},
  other:{n:"ลาอื่นๆ (ไม่รับค่าจ้าง)",ref:"ข้อ 28"}
};
const lvName=k=>LEAVE[k]?.n||"ลา";
function addDays(k,n){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return dkey(d)}
function lvDays(q){const ds=daysBetween(q.from,q.to);return LEAVE[q.leaveType]?.cal?ds.length:ds.filter(isWorkDay).length}
function hireOf(e){if(!e)return null;if(e.hireDate)return e.hireDate;const m=/^(\d{2})(\d{2})(\d{2})-/.exec(e.code||"");if(!m||+m[2]<1||+m[2]>12)return null;return `${2500+Number(m[1])-543}-${m[2]}-${m[3]}`}
function probEnd(e){const h=hireOf(e);return h?addDays(h,119):null}
function inProb(e,k){const p=probEnd(e);return !!p&&(k||dkey(new Date()))<p}
function tenureYears(e,k){const h=hireOf(e);if(!h)return 99;return (new Date(k+"T12:00:00")-new Date(h+"T12:00:00"))/(365.25*864e5)}
function vacEnt(e){const today=dkey(new Date());if(tenureYears(e,today)>=1)return 6;if(inProb(e))return 0;const mo=Number(hireOf(e).slice(5,7));return mo<=2?5:mo<=4?4:mo<=6?3:mo<=8?2:mo===9?1:0}
function capOf(e,k){return k==="vacation"?vacEnt(e):(LEAVE[k]?.cap??null)}
function usedLeave(empId,k,year,exclId){let d=0,n=0;for(const q of S.reqs){if(q.empId!==empId||q.kind!=="leave"||q.leaveType!==k||q.status==="rejected"||q.id===exclId)continue;if(year&&!(q.from||"").startsWith(year))continue;d+=lvDays(q);n++}return{d,n}}
function touchesHoliday(from,to){if(daysBetween(from,to).some(k=>holOf(k)))return true;let d=addDays(from,-1);for(let i=0;i<5;i++){if(holOf(d))return true;if(isWorkDay(d))break;d=addDays(d,-1)}
  d=addDays(to,1);for(let i=0;i<5;i++){if(holOf(d))return true;if(isWorkDay(d))break;d=addDays(d,1)}return false}
function leaveWarnings(e,q){
  const L=LEAVE[q.leaveType]||{};const w=[];const today=dkey(new Date());const days=lvDays(q);
  if(!days)w.push("ช่วงวันที่เลือกไม่มีวันทำงาน");
  const ahead=Math.round((new Date(q.from+"T12:00:00")-new Date(today+"T12:00:00"))/864e5);
  if(L.notice&&ahead<L.notice)w.push(`ควรยื่นล่วงหน้าอย่างน้อย ${L.notice} วัน (${L.ref})`);
  if(L.maxRun&&days>L.maxRun)w.push(`ลาพักร้อนติดต่อกันได้ไม่เกิน ${L.maxRun} วัน (${L.ref})`);
  const used=usedLeave(e.id,q.leaveType,L.once?null:q.from.slice(0,4),q.id);const cap=capOf(e,q.leaveType);
  if(L.once&&used.n>0)w.push(`สิทธิ์${L.n}ใช้ได้ครั้งเดียว (${L.ref})`);
  if(L.afterProb&&inProb(e,q.from))w.push(`ต้องพ้นระยะทดลองงานก่อน (${L.ref})`);
  if(cap!=null&&used.d+days>cap)w.push(q.leaveType==="vacation"&&cap===0?`ยังไม่มีสิทธิ์ลาพักร้อน${inProb(e)?" เพราะอยู่ระหว่างทดลองงาน":""} (${L.ref})`:`เกินสิทธิ์ (รวม ${used.d+days} จาก ${cap} วัน) ส่วนที่เกินถือเป็นลากิจไม่รับค่าจ้าง (ข้อ 28)`);
  else if(L.paid&&used.d+days>L.paid)w.push(`ลากิจรับค่าจ้างได้ไม่เกิน ${L.paid} วันต่อปี ส่วนที่เกินไม่ได้รับค่าจ้าง (${L.ref})`);
  if(L.times&&used.n>=L.times)w.push(`ลาฝึกอบรมได้ไม่เกิน ${L.times} ครั้งต่อปี (${L.ref})`);
  if(L.cert&&days>=L.cert)w.push(`ลาป่วยตั้งแต่ ${L.cert} วันขึ้นไปต้องยื่นใบรับรองแพทย์ (${L.ref})`);
  if(!["sick","maternity","funeral"].includes(q.leaveType)&&days&&touchesHoliday(q.from,q.to))w.push("ลาติดกับวันหยุดบริษัท ต้องมีเหตุอันควร (ข้อ 30)");
  return w;
}

function reqWhen(q){return q.kind==="ot"?thDate(q.from):(q.from===q.to?thDate(q.from):`${thDate(q.from)} – ${thDate(q.to)}`)}
function daysBetween(a,b){const out=[];let d=new Date(a+"T12:00:00");const e=new Date((b||a)+"T12:00:00");while(d<=e&&out.length<366){out.push(dkey(d));d.setDate(d.getDate()+1)}return out}

function reqFlags(q,live){
  if(q.kind!=="leave")return"";const e=S.emps.find(x=>x.id===q.empId);

  let bal="";if(e){const cap=capOf(e,q.leaveType);const u=usedLeave(e.id,q.leaveType,LEAVE[q.leaveType]?.once?null:q.from.slice(0,4)).d;if(cap!=null)bal=`<div class="muted small">ใช้สิทธิ์${lvName(q.leaveType)}${LEAVE[q.leaveType]?.once?"":"ปีนี้"} ${u}/${cap} วัน (รวมคำขอนี้)</div>`}
  return bal+(w.length?`<ul class="warns small">${w.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
}

function monthStats(month,dmIn){
  const dm=dmIn||dayMap();const today=dkey(new Date());const from=S.cfg.trackFrom||"0000";const wds=monthWorkDays(month);
  return S.emps.filter(e=>e.active!==false).map(e=>{
    let days=0,late=0,half=0,hours=0;const absentDays=[],halfDays=[];
    for(const k in dm){const [id,d]=k.split("|");if(id!==e.id||!d.startsWith(month))continue;const v=dm[k];hours+=workHours(v);
      if(v.in){const st=inStatus(v.in);if(st==="full")absentDays.push(d);else{days++;if(st==="late")late++;if(st==="half"){half++;halfDays.push(d)}}}}
    const leaveDays=new Set();let leave=0,ot=0;
    for(const q of S.reqs){if(q.empId!==e.id||q.status!=="approved")continue;
      if(q.kind==="leave"){const ds=daysBetween(q.from,q.to);ds.forEach(d=>leaveDays.add(d));leave+=ds.filter(d=>d.startsWith(month)&&(LEAVE[q.leaveType]?.cal||isWorkDay(d))).length}
      else if(q.from?.startsWith(month))ot+=Number(q.hours)||0}
    wds.filter(d=>d>=from&&d<today&&!dm[e.id+"|"+d]?.in&&!leaveDays.has(d)).forEach(d=>absentDays.push(d));
    absentDays.sort();const absOcc=absentDays.length+half;
    return {e,days,late,half,hours,leave,ot,absent:absentDays.length+half*0.5,absentDays,halfDays,absOcc,warnLate:late>=3,warnAbs:absOcc>=2};
  });
}
function yearWarnings(month){
  const dm=dayMap();const y=month.slice(0,4);const out={};
  for(let m=1;m<=Number(month.slice(5,7));m++){for(const s of monthStats(`${y}-${pad(m)}`,dm)){const o=out[s.e.id]??={late:0,abs:0};if(s.warnLate)o.late++;if(s.warnAbs)o.abs++}}
  return out;
}

function getPos(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  try{navigator.geolocation.getCurrentPosition(p=>res(p.coords),()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:30000})}catch(e){res(null)}
  setTimeout(()=>res(null),9000)})}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const s=240/Math.max(img.width,img.height);const c=document.createElement("canvas");c.width=Math.round(img.width*Math.min(1,s));c.height=Math.round(img.height*Math.min(1,s));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.7))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

function startPunch(){
  if(S.busy)return;
  if(S.cfg.requirePhoto){const cam=$("#cam");cam.value="";cam.onchange=async()=>{const f=cam.files[0];if(!f)return;let photo=null;try{photo=await shrink(f)}catch(e){toast("อ่านรูปไม่ได้ ลองถ่ายใหม่อีกครั้ง");return}punch(photo)};cam.click()}
  else punch(null);
}
async function punch(photo){
  const me=S.emps.find(e=>e.id===S.me);if(!me)return;
  S.busy=true;render();
  const now=Date.now(),today=dkey(new Date(now));
  const todayRecs=S.recs.filter(r=>r.empId===me.id&&r.date===today).sort((a,b)=>a.ts-b.ts);
  const last=todayRecs[todayRecs.length-1];const type=!last||last.type==="out"?"in":"out";
  const pos=await getPos();
  let gps="none",d=null;
  if(pos){if(S.cfg.lat!=null&&S.cfg.lng!=null){d=dist(pos.latitude,pos.longitude,Number(S.cfg.lat),Number(S.cfg.lng));gps=d<=Number(S.cfg.radius||200)?"ok":"far"}else gps="pos"}
  try{
    await S.db.collection("records").add({empId:me.id,empName:me.name,type,ts:now,date:today,photo:photo||null,
      lat:pos?.latitude??null,lng:pos?.longitude??null,acc:pos?.accuracy??null,gps,dist:d});
    toast(`${type==="in"?"เข้างาน":"ออกงาน"} ${hm(now)} น. บันทึกแล้ว${gps==="none"?" (ไม่มี GPS)":gps==="far"?" (อยู่นอกพื้นที่)":""}`);
  }catch(e){toast(e?.code==="invalid_argument"?"คุณยังไม่มีสิทธิ์บันทึก ให้ผู้จัดการแชร์แอปแบบ Contributor":"บันทึกไม่สำเร็จ ลองอีกครั้ง")}
  S.busy=false;render();
}

  const col=n=>(data[n]??={});

    onSnapshot(next){const run=()=>{let docs=Object.entries(col(n)).map(([id,d])=>({id,d}));
      if(ord)docs.sort((a,b)=>((a.d[ord[0]]??0)>(b.d[ord[0]]??0)?1:-1)*(ord[1]==="desc"?-1:1));if(lim)docs=docs.slice(0,lim);
      next({docs:docs.map(x=>({id:x.id,data:()=>x.d}))})};subs.add(run);setTimeout(run,0);return()=>subs.delete(run)}});
  const ref=(n,id)=>({id,set:async d=>{col(n)[id]={...d};save()},update:async d=>{col(n)[id]={...(col(n)[id]||{}),...d};save()},delete:async()=>{delete col(n)[id];save()}});
  return{collection:n=>({...query(n),doc:id=>ref(n,id||nid()),add:async d=>{const id=nid();col(n)[id]={...d};save();return ref(n,id)}}),

}

function toRow(t,d){const o={};for(const [j,c,to] of FIELDS[t].f){if(d[j]===undefined||(RO[t]||[]).includes(j))continue;o[c]=to&&d[j]!=null?to(d[j]):d[j]}return o}
function fromRow(t,r){const o={};for(const [j,c,,fr] of FIELDS[t].f){if(r[c]!==undefined)o[j]=fr?fr(r[c]):r[c]}return o}
function sbDb(sb){
  const store={};const subs={};
  const tbl=n=>store[n]??=new Map();
  const idOf=(n,r)=>n==="config"?"main":(FIELDS[n].idOf?FIELDS[n].idOf(r):r[FIELDS[n].pk]);
  const put=(n,r)=>{if(n==="config"){tbl(n).set("main",r.data||{});return}tbl(n).set(idOf(n,r),fromRow(n,r))};
  const notify=n=>(subs[n]||[]).forEach(f=>f());
  const yearStart=()=>{const d=new Date();const a=`${d.getFullYear()}-01-01`;d.setDate(1);d.setMonth(d.getMonth()-1);const b=dkey(d);return a<b?a:b};
  async function load(n){
    tbl(n).clear();
    if(n==="records"){
      const cols="id,emp_id,emp_name,type,ts,date,lat,lng,acc,gps,dist";
      for(let i=0;;i+=1000){const {data,error}=await sb.from("records").select(cols).gte("date",yearStart()).order("ts").range(i,i+999);if(error)throw error;data.forEach(r=>put(n,r));if(data.length<1000)break}
      const {data:ph}=await sb.from("records").select("id,photo").eq("date",dkey(new Date())).not("photo","is",null);
      (ph||[]).forEach(r=>{const x=tbl(n).get(r.id);if(x)x.photo=r.photo});
    }else{const {data,error}=await sb.from(n).select("*");if(error)throw error;data.forEach(r=>put(n,r))}
    notify(n);
  }
  sb.channel("timecool").on("postgres_changes",{event:"*",schema:"public"},pl=>{
    const n=pl.table;if(!store[n])return;
    if(pl.eventType==="DELETE"){const o=pl.old||{};tbl(n).delete(n==="holidays"?"h"+o.date:o.id)}
    else{const r={...pl.new};if(n==="records"&&r.date!==dkey(new Date()))delete r.photo;put(n,r)}
    notify(n);
  }).subscribe();
  const ref=(n,id)=>({id,
    async set(d){let q;if(n==="config")q=sb.from("config").upsert({id:1,data:d}).select().single();
      else{const row=toRow(n,d);if(FIELDS[n].keyOf)row[FIELDS[n].pk]=FIELDS[n].keyOf(id);else row.id=id;q=sb.from(n).upsert(row).select().single()}
      const {data,error}=await q;if(error)throw error;put(n,data);notify(n)},
    async update(d){let q;if(n==="config")q=sb.from("config").upsert({id:1,data:{...(tbl(n).get("main")||{}),...d}}).select().single();
      else q=sb.from(n).update(toRow(n,d)).eq(FIELDS[n].pk,FIELDS[n].keyOf?FIELDS[n].keyOf(id):id).select().single();
      const {data,error}=await q;if(error)throw error;put(n,data);notify(n)},
    async delete(){const {error}=await sb.from(n).delete().eq(FIELDS[n].pk,FIELDS[n].keyOf?FIELDS[n].keyOf(id):id);if(error)throw error;tbl(n).delete(id);notify(n)}});
  const query=(n,ord,lim)=>({orderBy:(f,dir)=>query(n,[f,dir],lim),limit:k=>query(n,ord,n==="records"?null:k),
    onSnapshot(next,err){const run=()=>{let docs=[...tbl(n).entries()].map(([id,d])=>({id,d}));
        if(ord)docs.sort((a,b)=>((a.d[ord[0]]??0)>(b.d[ord[0]]??0)?1:-1)*(ord[1]==="desc"?-1:1));if(lim)docs=docs.slice(0,lim);
        next({docs:docs.map(x=>({id:x.id,data:()=>x.d}))})};
      (subs[n]??=[]).push(run);load(n).catch(e=>{console.error(e);err&&err(e)});return()=>{subs[n]=subs[n].filter(f=>f!==run)}}});
  return{collection:n=>({...query(n),doc:id=>ref(n,id||crypto.randomUUID()),
      add:async d=>{const {data,error}=await sb.from(n).insert(toRow(n,d)).select().single();if(error)throw error;put(n,data);notify(n);return ref(n,data.id)}}),
    doc:p=>{const [n,id]=p.split("/");return ref(n,id)},reload:load};
}

  <label>PIN ใหม่ 6 หลัก<input id="npPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" required></label>

function acctLine(e){
  if(e.userId)return`<div class="row small" style="gap:6px;margin-top:4px"><span class="pill p-ok">ลงทะเบียนแล้ว</span>${e.id!==S.me?`<button class="btn sm" data-reset="${esc(e.id)}">${S.confirmReset===e.id?"ยืนยันรีเซ็ต":"รีเซ็ตบัญชี"}</button>`:""}</div>`;
  return`<div class="small" style="margin-top:4px"><span class="pill p-warn">ยังไม่ลงทะเบียน</span> รหัสเปิดใช้งาน <b class="mono">${esc(S.secrets?.[e.id]||"…")}</b></div>`;

const pinOk=v=>/^\d{6}$/.test(v);
async function sbErrMsg(e){return e?.message||String(e)}
async function doLogin(ev){
  ev.preventDefault();const code=$("#lgCode").value.trim(),pin=$("#lgPin").value.trim();
  S.authBusy=true;S.authErr="";render();
  try{const {data:email,error}=await S.sb.rpc("login_email",{p_code:code});if(error)throw error;
    if(!email){S.authErr="ไม่พบรหัสพนักงานนี้";return}
    const r=await S.sb.auth.signInWithPassword({email,password:pin});
    if(r.error){S.authErr=/confirm/i.test(r.error.message)?"ระบบยังเปิดการยืนยันอีเมลอยู่ ให้ผู้ดูแลปิด Confirm email ใน Supabase":"รหัสพนักงานหรือ PIN ไม่ถูกต้อง หรือยังไม่ได้ลงทะเบียน";return}
  }catch(e){S.authErr="เชื่อมต่อไม่สำเร็จ: "+await sbErrMsg(e)}
  finally{S.authBusy=false;render()}
}
async function doRegister(ev){
  ev.preventDefault();const code=$("#rgCode").value.trim(),act=$("#rgAct").value.trim().toUpperCase(),pin=$("#rgPin").value.trim(),pin2=$("#rgPin2").value.trim();
  if(!pinOk(pin)){S.authErr="PIN ต้องเป็นตัวเลข 6 หลัก";render();return}
  if(pin!==pin2){S.authErr="PIN ทั้งสองช่องไม่ตรงกัน";render();return}
  S.authBusy=true;S.authErr="";render();
  try{
    const {data:ok,error:e1}=await S.sb.rpc("check_activation",{p_code:code,p_activation:act});if(e1)throw e1;
    if(!ok){S.authErr="รหัสพนักงานหรือรหัสเปิดใช้งานไม่ถูกต้อง หรือรหัสนี้ลงทะเบียนไปแล้ว";return}
    const {data:email}=await S.sb.rpc("login_email",{p_code:code});
    let r=await S.sb.auth.signUp({email,password:pin});
    if(r.error&&/registered|exists/i.test(r.error.message))r=await S.sb.auth.signInWithPassword({email,password:pin});
    if(r.error){S.authErr="ลงทะเบียนไม่สำเร็จ: "+r.error.message;return}
    if(!r.data.session){S.authErr="ระบบยังเปิดการยืนยันอีเมลอยู่ ให้ผู้ดูแลปิด Confirm email ใน Supabase";return}
    const {error:e3}=await S.sb.rpc("claim_account",{p_code:code,p_activation:act});
    if(e3){S.authErr="ผูกบัญชีไม่สำเร็จ: "+e3.message;await S.sb.auth.signOut();return}
    toast("ลงทะเบียนสำเร็จ");await startSession();
  }catch(e){S.authErr="เชื่อมต่อไม่สำเร็จ: "+await sbErrMsg(e)}
  finally{S.authBusy=false;render()}
}
async function changePin(ev){
  ev.preventDefault();const a=$("#npPin").value.trim(),b=$("#npPin2").value.trim();
  if(!pinOk(a)){toast("PIN ต้องเป็นตัวเลข 6 หลัก");return}if(a!==b){toast("PIN ไม่ตรงกัน");return}
  const {error}=await S.sb.auth.updateUser({password:a});
  if(error){toast("เปลี่ยน PIN ไม่สำเร็จ: "+error.message);return}
  S.showPin=false;clean("#pinForm");render();toast("เปลี่ยน PIN แล้ว");
}
async function loadSecrets(){if(!S.sb||!S.isMgr)return;const {data}=await S.sb.from("employee_secrets").select("emp_id,activation");S.secrets=Object.fromEntries((data||[]).map(r=>[r.emp_id,r.activation]));render()}
async function toggleRole(id){const e=S.emps.find(x=>x.id===id);if(!e)return;
  try{await S.db.doc("employees/"+id).update({role:e.role==="manager"?"employee":"manager"});toast("อัปเดตสิทธิ์แล้ว")}catch(err){toast("อัปเดตไม่สำเร็จ")}}
async function resetAcct(id){
  if(S.confirmReset!==id){S.confirmReset=id;render();return}S.confirmReset=null;
  const {data,error}=await S.sb.rpc("reset_account",{p_emp:id});
  if(error){toast("รีเซ็ตไม่สำเร็จ");render();return}
  await S.db.reload("employees");await loadSecrets();toast("รีเซ็ตแล้ว รหัสเปิดใช้งานใหม่ "+data);
}
let started=false;
async function startSession(){
  const {data:{session}}=await S.sb.auth.getSession();S.session=session;
  if(!session){S.loading=false;render();return}
  const {data:me}=await S.sb.from("employees").select("*").eq("user_id",session.user.id).maybeSingle();
  if(!me){S.noEmp=true;S.loading=false;render();return}
  S.noEmp=false;S.me=me.id;S.isMgr=me.role==="manager";
  if(S.isMgr&&ls.get("tokbat.view")!=="emp")S.view="mgr";
  if(!started){started=true;S.db=sbDb(S.sb);subscribeAll(S.db);loadSecrets()}
  S.loading=false;render();
}

/* ---------- boot ---------- */
async function boot(){
  S.me=ls.get("tokbat.me");
  render();
  let db,user;
  if(window.claude?.use){[db,user]=await Promise.all([claude.use("db"),claude.use("user")])}
  else if(SUPABASE_URL&&SUPABASE_KEY&&window.supabase){
    S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);S.loading=true;render();
    $("#logoutBtn").onclick=async()=>{await S.sb.auth.signOut();location.reload()};
    $("#pinBtn").onclick=()=>{S.showPin=!S.showPin;render();window.scrollTo(0,0)};
    S.sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&!started)setTimeout(startSession,0)});
    await startSession();return;
  }
  else{db=localDb();S.demo=true;S.isMgr=true;const b=$("#demoBar");if(b)b.hidden=false}
  S.db=db;S.user=user;
  if(user){try{S.isMgr=!!(await user.canEdit())}catch(e){}}
  if(S.isMgr&&ls.get("tokbat.view")!=="emp")S.view="mgr";
  render();
  if(!db)return;
  subscribeAll(db);
}
function subscribeAll(db){
  const err=()=>toast("การเชื่อมต่อข้อมูลขัดข้อง ลองรีเฟรชหน้า");
  db.collection("employees").onSnapshot(s=>{S.emps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.code||"").localeCompare(b.code||"")||(a.createdAt||0)-(b.createdAt||0));S.ready.emps=true;render();if(S.sb&&S.isMgr){clearTimeout(subscribeAll.t);subscribeAll.t=setTimeout(loadSecrets,500)}},err);
  db.collection("config").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="main");S.cfg={...DEF,...(d?d.data():{})};render()},err);
  db.collection("holidays").onSnapshot(s=>{S.hols=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date.localeCompare(b.date));render()},err);
  db.collection("records").orderBy("ts","desc").limit(1000).onSnapshot(s=>{S.recs=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.recs=true;render()},err);
  db.collection("requests").orderBy("createdAt","desc").limit(500).onSnapshot(s=>{S.reqs=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.reqs=true;render()},err);
}
document.addEventListener("input",e=>{if(e.target.id&&e.target.matches("input,select,textarea"))e.target.dataset.dirty="1"});
document.addEventListener("change",e=>{if(e.target.id&&e.target.matches("input,select,textarea")&&e.target.id!=="repMonth")e.target.dataset.dirty="1"});
const clean=sel=>document.querySelectorAll(sel+" [data-dirty]").forEach(el=>delete el.dataset.dirty);
$("#segEmp").addEventListener("click",()=>ls.set("tokbat.view","emp"));
$("#segMgr").addEventListener("click",()=>ls.set("tokbat.view","mgr"));
boot();
